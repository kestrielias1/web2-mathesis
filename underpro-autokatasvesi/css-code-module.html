<style>
.upk{font-family:Manrope,'Segoe UI',Helvetica,Arial,sans-serif;color:#121a24 !important}
.upk .upk-t,.upk .upk-t p,.upk .upk-t li{font-size:16px;line-height:1.65;color:#121a24 !important}
.upk h1,.upk h2,.upk h3,.upk h4{font-family:Barlow,'Arial Narrow',Arial,sans-serif;line-height:1.12;color:#121a24 !important;padding-bottom:0;text-wrap:balance}
.upk h2{font-size:clamp(28px,4vw,40px);font-weight:700;margin:0 0 14px}
.upk h3{font-size:clamp(22px,2.6vw,28px);font-weight:700;margin:0 0 12px}
.upk h4{font-size:20px;font-weight:700;margin:10px 0 6px}
.upk .upk-t p{padding-bottom:12px}
.upk .upk-eyebrow{display:block;font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#1f6fcf !important;margin-bottom:10px}
.upk .upk-lead,.upk .upk-t p.upk-lead{font-size:18px;color:#4a5665 !important;max-width:65ch}
.upk .upk-badge{display:inline-block;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#d7262e !important;border:1.5px solid #d7262e !important;padding:6px 10px;border-radius:999px;margin-bottom:14px}
.upk .upk-btns{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 18px}
.upk a.upk-btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:10px;font-weight:700;font-size:15px;line-height:1;text-decoration:none}
.upk a.upk-btn.primary{background:#3a8ded !important;color:#fff !important}
.upk a.upk-btn.ghost{border:1.5px solid rgba(255,255,255,.35) !important;color:#f4f7fb !important}
.upk .upk-css-row,.upk .upk-css-row .et_pb_column,.upk .upk-styles{margin:0!important;padding:0!important;min-height:0}
.upk-hero,.upk-cta{background-image:radial-gradient(ellipse at 85% 110%,rgba(215,38,46,.35),transparent 55%)}
.upk-hero .upk-t,.upk-hero .upk-t p,.upk-cta .upk-t,.upk-cta .upk-t p{color:#b7c3d1 !important}
.upk-hero h1{font-size:clamp(36px,6vw,64px);font-weight:800;color:#f4f7fb !important;margin:0 0 18px}
.upk-hero h1 em{font-style:normal;color:#ff6a6f !important}
.upk-cta h2{color:#f4f7fb !important}
.upk-hero .upk-eyebrow{color:#cbb28c !important}
.upk-facts{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:14px}
.upk-facts span:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#cbb28c !important;margin-right:8px;vertical-align:middle}
.upk .upk-img img{border-radius:14px;background:#fff !important}
.upk .upk-img.framed img{border:1px solid #dbe3ec !important;padding:12px}
.upk .upk-sizes img{max-height:320px;width:auto}
.upk .upk-caption{font-size:13px;color:#4a5665 !important}
.upk-timeline{background:#fff !important;border:1px solid #dbe3ec !important;border-radius:14px;padding:28px 24px 22px;overflow-x:auto;margin-bottom:28px}
.upk-tl-track{position:relative;min-width:620px;height:150px}
.upk-tl-bar{position:absolute;left:0;right:0;top:64px;height:14px;border-radius:7px;background:linear-gradient(90deg,#ffd27a 0%,#ff9f40 30%,#d7262e 62%,#7a0f14 100%) !important}
.upk-tl-zone{position:absolute;left:0;top:56px;width:6%;height:30px;border:2px dashed #3a8ded !important;border-radius:8px}
.upk-tl-mark{position:absolute;top:0;transform:translateX(-50%);display:grid;justify-items:center;gap:6px;width:150px;text-align:center}
.upk-tl-mark .t{font-family:Barlow,Arial,sans-serif;font-weight:800;font-size:20px;line-height:1;color:#121a24 !important}
.upk-tl-mark .pin{width:2px;height:30px;background:#4a5665 !important}
.upk-tl-mark .d{font-size:13px;line-height:1.35;color:#4a5665 !important;margin-top:24px}
.upk-tl-mark.first{transform:none;justify-items:start;text-align:left}
.upk-tl-mark.first .t{color:#1f6fcf !important}
.upk-tl-axis{display:flex;justify-content:space-between;min-width:620px;font-size:12px;color:#4a5665 !important;border-top:1px solid #dbe3ec !important;padding-top:8px;margin-top:4px}
.upk-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.upk-stat{background:#fff !important;border:1px solid #dbe3ec !important;border-radius:12px;padding:22px;display:grid;gap:8px;align-content:start}
.upk-stat .n{font-family:Barlow,Arial,sans-serif;font-weight:800;font-size:clamp(34px,4vw,46px);line-height:1;color:#d7262e !important}
.upk-stat .l{font-weight:600;color:#121a24 !important;line-height:1.4}
.upk-stat .s{font-size:13px;color:#4a5665 !important;line-height:1.45}
.upk-gr .upk-stat .n{color:#1f6fcf !important}
.upk-gr-head{border-top:1px solid #dbe3ec !important;padding-top:28px;margin-top:8px}
.upk .upk-callout{border-left:4px solid #d7262e !important;background:#fdecec !important;padding:18px 20px;border-radius:0 10px 10px 0;font-size:17px;max-width:820px}
.upk ul.upk-ticks{list-style:none;padding:0;margin:0 0 8px}
.upk ul.upk-ticks li{padding:0 0 10px 28px;position:relative}
.upk ul.upk-ticks li:before{content:'';position:absolute;left:2px;top:7px;width:14px;height:8px;border-left:2.5px solid #3a8ded !important;border-bottom:2.5px solid #3a8ded !important;transform:rotate(-45deg)}
.upk .upk-card{background:#fff !important;border:1px solid #dbe3ec !important;border-radius:12px;padding:20px}
.upk .upk-card ul{padding-left:18px;margin:0 0 10px}
.upk .upk-card p,.upk .upk-card li{font-size:15px;color:#4a5665 !important}
.upk-spec{display:flex;flex-wrap:wrap;gap:8px}
.upk-spec span{font-size:13px;font-weight:600;background:#f3f6fa !important;border:1px solid #dbe3ec !important;padding:5px 9px;border-radius:6px;color:#121a24 !important}
.upk-temps{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.upk-temps span{font-weight:700;font-size:14px;line-height:1;padding:8px 11px;border-radius:999px;color:#fff !important}
.upk-heads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.upk-head-card{border:1px solid #dbe3ec !important;border-radius:10px;padding:14px;background:#fff !important}
.upk-head-card b{display:block;font-family:Barlow,Arial,sans-serif;font-size:18px;color:#121a24 !important}
.upk-head-card span{font-size:14px;color:#4a5665 !important}
.upk-tablewrap{overflow-x:auto;border:1px solid #dbe3ec !important;border-radius:12px;background:#fff !important}
.upk-tablewrap table{border-collapse:collapse;width:100%;min-width:620px;font-size:15px;border:0 !important;margin:0}
.upk-tablewrap th,.upk-tablewrap td{text-align:left;padding:14px 16px;border:0 !important;border-bottom:1px solid #dbe3ec !important;vertical-align:top;color:#121a24 !important}
.upk-tablewrap thead th{font-family:Barlow,Arial,sans-serif;font-size:17px;background:#f3f6fa !important}
.upk-tablewrap tbody th{font-weight:600;color:#4a5665 !important;width:26%}
.upk-tablewrap tr:last-child th,.upk-tablewrap tr:last-child td{border-bottom:0 !important}
.upk-props{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.upk-props div{background:#fff !important;border:1px solid #dbe3ec !important;border-radius:10px;padding:14px;font-weight:600;font-size:15px;color:#121a24 !important}
.upk-apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.upk-app{border-top:3px solid #cbb28c !important;padding-top:12px;display:grid;gap:4px}
.upk-app b{font-family:Barlow,Arial,sans-serif;font-size:18px;color:#121a24 !important}
.upk-app span{font-size:14px;color:#4a5665 !important}
.upk-contact{display:grid;gap:10px;background:rgba(255,255,255,.06) !important;border:1px solid rgba(255,255,255,.14) !important;border-radius:14px;padding:24px;color:#f4f7fb !important}
.upk-contact small{color:#b7c3d1 !important;font-size:14px}
.upk-contact .big{font-family:Barlow,Arial,sans-serif;font-weight:800;font-size:28px;line-height:1.1}
.upk-sources ol{padding-left:20px;font-size:14px;color:#4a5665 !important}
.upk-sources li{padding-bottom:8px}
@media (max-width:980px){.upk-stats,.upk-apps{grid-template-columns:1fr 1fr}.upk-heads{grid-template-columns:1fr}}
@media (max-width:520px){.upk-stats,.upk-props{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.upk-tl-bar{background-size:200% 100%;animation:upkburn 6s ease-in-out infinite alternate}@keyframes upkburn{from{background-position:0 0}to{background-position:30% 0}}}
</style>
